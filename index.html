<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bestellapp</title>
        <link rel="icon" type="image/png" href="assets/img/hero-icon.png" />
        <link rel="stylesheet" href="style.css" />
        <script defer src="array.js"></script>
        <script defer src="templates.js"></script>
        <script defer src="script.js"></script>
    </head>
    <body id="start">
        <header class="pageHeader">
            <div class="headerContent pageWidth">
                <a href="#start" aria-label="Bestell App - zum Seitenanfang">
                    <img
                        src="assets/icons/app-icon.png"
                        alt="Bestell App"
                        width="120"
                        height="47"
                    />
                </a>
                <span class="menuIcon" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </div>
        </header>

        <main class="pageLayout">
            <div class="restaurant">
                <div class="restaurantHero">
                    <img
                        class="heroImage"
                        src="assets/img/hero.png"
                        alt="Burger, Pommes und Pizza"
                    />
                    <img
                        class="restaurantLogo"
                        src="assets/img/hero-icon.png"
                        alt=""
                    />
                </div>
                <section
                    class="restaurantInfo"
                    aria-labelledby="restaurant-name"
                >
                    <h1 id="restaurant-name"><span>Burger</span>House</h1>

                    <p class="rating">
                        <img src="assets/icons/star-icon.png" alt="" />
                        Bewertung (4,1 von 5 Sternen)
                    </p>

                    <p>Burger, Pizza und frische Salate. Lieferung 4,99 €.</p>
                </section>
                <nav class="categoryNav" aria-label="Kategorien">
                    <a href="#burger">Burger & Sandwiches</a>
                    <a href="#pizza">Pizza</a>
                    <a href="#salate">Salate</a>
                </nav>
                <div id="menuList" class="menuList"></div>
            </div>
        </main>
    </body>
</html>
